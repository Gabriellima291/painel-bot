<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do bot</title>
  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: #1f2937;
      border-radius: 16px;
    }

    button {
      padding: 14px 22px;
      background: #25d366;
      color: #111827;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Painel do bot</h1>
    <p>Conecte seu WhatsApp para usar o bot.</p>

    <button onclick="conectar()">Conectar WhatsApp</button>

    <p id="status" role="status"></p>
  </main>

  <script>
    function conectar() {
      document.getElementById("status").textContent =
        "Página funcionando! Agora precisamos ligá-la ao seu bot.";
    }
  </script>
</body>
</html>
